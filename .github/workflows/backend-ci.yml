name: WapiBei Backend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install Dependencies
        working-directory: ./backend
        run: pnpm install

      - name: Prisma Schema Validation
        working-directory: ./backend
        run: npx prisma validate
        env:
          # Utilisation du secret configuré sur GitHub pour tester la vraie connexion
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build Backend
        working-directory: ./backend
        run: pnpm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
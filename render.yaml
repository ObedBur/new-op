services:
  # Le Serveur Backend (NestJS)
  - type: web
    name: wapibei-backend
    env: docker
    rootDir: backend
    plan: starter # Minimum recommandé pour prod (pas gratuit mais $7/mois)
    healthCheckPath: /api/health # Endpoint pour vérifier que le serveur est en ligne
    envVars:
      # ============ BASE DE DONNÉES ============
      - key: DATABASE_URL
        sync: false # À configurer dans Render Dashboard -> Secrets
      
      # ============ ENVIRONNEMENT ============
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      
      # ============ JWT (SÉCURITÉ) ============
      - key: JWT_SECRET
        sync: false # À configurer dans Render Dashboard -> Secrets
      - key: JWT_REFRESH_SECRET
        sync: false # À configurer dans Render Dashboard -> Secrets
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      
      # ============ EMAIL (BREVO) ============
      - key: BREVO_API_KEY
        sync: false # À configurer dans Render Dashboard -> Secrets
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        value: noreply@wapibei.com
      
      # ============ NOTIFICATIONS PUSH ============
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_EMAIL
        value: mailto:support@wapibei.com
      
      # ============ REDIS (Cache & Sessions) ============
      # Sur Render, utiliser un service Redis séparé (Render Redis ou RedisGreen)
      - key: REDIS_HOST
        sync: false # URL du Redis (ex: redis-xxxxx.render.com)
      - key: REDIS_PORT
        value: 6379
      - key: REDIS_PASSWORD
        sync: false # Token d'authentification Redis
      - key: REDIS_TTL
        value: 600
      
      # ============ FRONTEND ============
      - key: FRONTEND_URL
        value: https://wapibei.vercel.app # À adapter à mon domaine

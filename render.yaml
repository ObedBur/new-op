services:
  - type: web
    name: wapibei-backend
    runtime: docker
    dockerfilePath: Dockerfile # On a supprimé "backend/" devant
    dockerContext: .    
    plan: starter
    healthCheckPath: /api/health
    envVars:
      # P3005 (schéma déjà présent sans historique migrate) : mettre la valeur "1" une fois,
      # redéployer, puis supprimer la variable sur Render.
      - key: PRISMA_MIGRATE_BASELINE
        sync: false
      - key: DATABASE_URL
        sync: false 
      # Optionnel : URL Postgres directe (Render / Neon). Si DATABASE_URL pointe vers Prisma Accelerate
      # (prisma-data.net), l’API Nest doit utiliser une URL directe pour @prisma/adapter-pg — sinon laissez vide
      # et mettez une URL Postgres directe dans DATABASE_URL.
      - key: DATABASE_DIRECT_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        sync: false 
      - key: JWT_REFRESH_SECRET
        sync: false 
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: BREVO_API_KEY
        sync: false 
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        value: obedburindi@gmail.com
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_EMAIL
        value: mailto:obedburindi@gmail.com
      - key: REDIS_HOST
        sync: false 
      - key: REDIS_PORT
        value: 6379
      - key: REDIS_TTL
        value: 600
      - key: FRONTEND_URL
        value: http://localhost:3000